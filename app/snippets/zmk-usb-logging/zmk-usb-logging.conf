CONFIG_ZMK_USB_LOGGING=y

# Skinner39 (2026-06-11): DBG level (ZMK's forced default). The INF/MINIMAL
# combination produced a build whose CDC TX was entirely silent (cause never
# isolated; see zmk-config-Skinner39 docs 2026-06-10 §5). DBG is the PROVEN-
# streaming pipeline; the volume problem is fixed at the source instead — the
# per-event hot-path LOG_DBG lines (trackball relay, per-report endpoint/hid/
# usb chatter) are deleted from this fork, so steady-state volume is near zero
# and the legacy USB stack's CDC never saturates under trackball motion.

# Boot-order safety: in LOG_MODE_DEFERRED the first log flush lands at
# boot + STARTUP_DELAY into the CDC. 15 s gives any capture process ample time
# to open the port after enumeration; boot messages buffer in LOG_BUFFER_SIZE.
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=15000
