CONFIG_ZMK_USB_LOGGING=y

# Skinner39 (2026-06-11): run the log at INF, set HERE because per-entry cmake-args
# proved unreliable through the zmk-config build matrix (a DBG artifact shipped
# with -DCONFIG_ZMK_LOG_LEVEL_INF=y silently ignored). DBG saturates the legacy
# USB stack CDC under trackball motion and the device falls off the bus.
CONFIG_ZMK_LOG_LEVEL_INF=y
# ZMK forces 'config ZMK_LOG_LEVEL / default 4' (app/Kconfig:553-557) unless
# ZMK_LOGGING_MINIMAL=y — that early default outranks the level choice above
# (first-satisfied default in parse order), which is why INF alone shipped DBG
# artifacts. MINIMAL removes the forced default; the choice then sets the level.
CONFIG_ZMK_LOGGING_MINIMAL=y
